# /etc/oauth2-proxy/oauth2-proxy.cfg on the pi, written by setup-pi.sh
# login for the portal, nginx asks /oauth2/auth on every request (auth_request mode)

http_address = "127.0.0.1:4180"
reverse_proxy = true
# only nginx on the same host may set X-Real-IP / X-Forwarded-*
trusted_proxy_ips = ["127.0.0.1"]

provider = "entra-id"
oidc_issuer_url = "https://login.microsoftonline.com/<TENANT_ID>/v2.0"
client_id = "<CLIENT_ID>"
client_secret_file = "/etc/oauth2-proxy/client-secret"
# offline_access gives a refresh token, without it cookie_refresh can't get a new id token
scope = "openid profile email offline_access"
code_challenge_method = "S256"
redirect_url = "https://portal.homelab.test/oauth2/callback"
# login.microsoftonline.com for the logout redirect (rd on /oauth2/sign_out)
whitelist_domains = ["portal.homelab.test", "login.microsoftonline.com"]
skip_provider_button = true

# cloud-only users often have no email claim, the login name is always there
oidc_email_claim = "preferred_username"
email_domains = ["*"]
# app roles, not groups; global admins skip the entra assignment, this stops them
oidc_groups_claim = "roles"
allowed_groups = ["portal-admin", "app-nextcloud", "app-jellyfin", "app-rezepte", "app-kalorien"]

# id token as bearer on the auth response, nginx hands it to the portal api (ADR 0018)
set_authorization_header = true

cookie_name = "__Host-hl_session"
cookie_secret_file = "/etc/oauth2-proxy/cookie-secret"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "12h"
# entra id tokens live about an hour
cookie_refresh = "30m"

# entra sessions are too big for one cookie, the browser only gets a ticket
session_store_type = "redis"
# db 0 belongs to nextcloud
redis_connection_url = "unix:///run/redis/redis-server.sock?db=1"

# auth only, nginx serves the content
upstreams = ["static://202"]
