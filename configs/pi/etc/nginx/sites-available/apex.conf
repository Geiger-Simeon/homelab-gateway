# /etc/nginx/sites-available/apex.conf on the pi, only with ACME_DOMAIN set
# the bare domain redirects to the portal for now, a static start page can go here later

server {
    # only reachable through the tunnel, the vps puts a PROXY header in front
    listen 443 ssl proxy_protocol;
    http2 on;
    server_name homelab.test;

    set_real_ip_from 10.99.0.1;
    real_ip_header proxy_protocol;

    # the wildcard doesn't cover the bare domain, homelab-cert puts both into the same certificate
    ssl_certificate     /etc/ssl/nginx/portal.homelab.test.crt;
    ssl_certificate_key /etc/ssl/nginx/portal.homelab.test.key;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 302, browsers keep a 301 and would skip the start page later
    return 302 https://portal.homelab.test/;
}
