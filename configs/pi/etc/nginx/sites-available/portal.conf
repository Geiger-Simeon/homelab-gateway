# /etc/nginx/sites-available/portal.conf on the pi
# portal start page; login through oauth2-proxy (127.0.0.1:4180), api on 127.0.0.1:8081

server {
    # only reachable through the tunnel, the vps puts a PROXY header in front
    listen 443 ssl proxy_protocol;
    http2 on;
    server_name portal.homelab.test;

    set_real_ip_from 10.99.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/ssl/nginx/portal.homelab.test.crt;
    ssl_certificate_key /etc/ssl/nginx/portal.homelab.test.key;

    server_tokens off;
    root /var/www/portal;
    index index.html;

    # the id token rides in a response header, entra tokens with roles get big
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    include snippets/portal-headers.conf;

    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location = /oauth2/auth {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        # auth_request sends headers only
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location /api/ {
        auth_request /oauth2/auth;
        auth_request_set $hl_token  $upstream_http_authorization;
        auth_request_set $hl_cookie $upstream_http_set_cookie;
        include snippets/portal-headers.conf;
        add_header Set-Cookie $hl_cookie;
        # replaces whatever the client sent, empty value means no header at all
        proxy_set_header Authorization $hl_token;
        proxy_set_header X-Real-IP     $remote_addr;
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @login;
        auth_request_set $hl_cookie $upstream_http_set_cookie;
        include snippets/portal-headers.conf;
        add_header Set-Cookie $hl_cookie;
        try_files $uri $uri/ /index.html;
    }

    location @login {
        return 302 /oauth2/start?rd=$request_uri;
    }

    # sign_out only drops the oauth2-proxy session, rd then ends the entra session too,
    # otherwise the next request logs straight back in; entra sends the browser back to /
    location = /logout {
        return 302 /oauth2/sign_out?rd=https%3A%2F%2Flogin.microsoftonline.com%2F<TENANT_ID>%2Foauth2%2Fv2.0%2Flogout%3Fpost_logout_redirect_uri%3Dhttps%253A%252F%252Fportal.homelab.test%252F;
    }
}
