# /etc/nginx/snippets/portal-headers.conf on the pi
# included in the server block and again in every location that sets its own add_header

add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff"     always;
add_header X-Frame-Options           "DENY"        always;
add_header Referrer-Policy           "no-referrer" always;
add_header X-Robots-Tag              "noindex, nofollow" always;
# angular material sets inline styles
add_header Content-Security-Policy   "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
