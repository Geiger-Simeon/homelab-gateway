#!/usr/sbin/nft -f
# /etc/nftables.conf on the pi

define LAN = 192.168.178.0/24

# only touch our own table, don't flush other rules
table inet gateway
delete table inet gateway

table inet gateway {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept

        icmp type echo-request accept
        meta l4proto ipv6-icmp accept

        # tunnel: only the vps, only the proxy port
        iifname "wg-gw" ip saddr 10.99.0.1 tcp dport 443 accept
        iifname "wg-gw" drop

        ip saddr $LAN tcp dport 22 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}
