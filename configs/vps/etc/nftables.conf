#!/usr/sbin/nft -f
# /etc/nftables.conf on the vps

define WG_PORT = 51820

# only touch our own table, don't flush other rules
table inet gateway
delete table inet gateway

table inet gateway {
    # one entry per source address, dropped again after a minute without new connections
    set ssh_rate4   { type ipv4_addr; flags dynamic, timeout; timeout 1m; size 65535; }
    set ssh_rate6   { type ipv6_addr; flags dynamic, timeout; timeout 1m; size 65535; }
    set https_rate4 { type ipv4_addr; flags dynamic, timeout; timeout 1m; size 65535; }
    set https_rate6 { type ipv6_addr; flags dynamic, timeout; timeout 1m; size 65535; }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept

        # pi may answer, but never open connections to the vps
        iifname "wg-gw" drop

        icmp type echo-request accept
        meta l4proto ipv6-icmp accept

        # new connections per source address, only slows down scanners and floods
        # dropped SYNs get retransmitted by the client, so normal users only see a delay
        tcp dport 22 ct state new update @ssh_rate4 { ip saddr limit rate over 5/minute burst 10 packets } counter drop
        tcp dport 22 ct state new update @ssh_rate6 { ip6 saddr limit rate over 5/minute burst 10 packets } counter drop
        tcp dport 443 ct state new update @https_rate4 { ip saddr limit rate over 20/second burst 50 packets } counter drop
        tcp dport 443 ct state new update @https_rate6 { ip6 saddr limit rate over 20/second burst 50 packets } counter drop

        tcp dport 22 accept
        tcp dport 443 accept
        udp dport $WG_PORT accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}
