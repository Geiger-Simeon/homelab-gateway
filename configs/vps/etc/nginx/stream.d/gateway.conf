# /etc/nginx/stream.d/gateway.conf on the vps
# needs 'include /etc/nginx/stream.d/*.conf;' at the end of nginx.conf (outside http)

stream {
    # forward by SNI, nothing gets decrypted here
    map $ssl_preread_server_name $backend {
        cloud.homelab.test  10.99.0.2:443;
        default             127.0.0.1:1;  # nothing listens, unknown names get dropped
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $backend;
        proxy_protocol on;
        proxy_connect_timeout 5s;
    }
}
