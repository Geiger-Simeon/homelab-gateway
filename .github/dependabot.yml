# version updates once a week, security updates come regardless of the schedule
version: 2
updates:
  - package-ecosystem: maven
    directory: /portal/backend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Berlin
    # new versions wait a week, pulled or hijacked releases are usually gone by then
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /portal/frontend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # angular majors go through ng update, it migrates the code as well
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
